{% extends 'base.html' %}
{% block title %}Profile | Northstar Learning{% endblock %}
{% block content %}
<section class="form-layout profile-layout"><div class="form-intro"><p class="eyebrow">YOUR ACCOUNT</p><h1>Keep your details up to date.</h1><p>Your profile helps us keep your learning organized.</p></div>
<form class="form-panel" method="post" aria-label="Profile details"><h2>Profile details</h2>
<label for="name">Full name</label><input id="name" name="name" value="{{ user.name }}" autocomplete="name" required>
<label for="email">Email</label><input id="email" name="email" type="email" value="{{ user.email }}" autocomplete="email" required>
<label for="password">New password <span class="optional">(leave blank to keep current)</span></label><input id="password" name="password" type="password" autocomplete="new-password">
<button type="submit">Save changes</button></form></section>
{% endblock %}
