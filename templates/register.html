{% extends 'base.html' %}
{% block title %}Create account | Northstar Learning{% endblock %}
{% block content %}
<section class="form-layout">
  <div class="form-intro"><p class="eyebrow">MAKE ROOM TO GROW</p><h1>Start learning on your terms.</h1><p>A small step today can open a whole new direction.</p></div>
  <form class="form-panel" method="post" aria-label="Create account">
    <h2>Create account</h2>
    <label for="name">Full name</label><input id="name" name="name" autocomplete="name" required>
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required>
    <button type="submit">Create account</button>
    <p class="form-note">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </form>
</section>
{% endblock %}
