{% extends 'base.html' %}
{% block title %}Log in | Northstar Learning{% endblock %}
{% block content %}
<section class="form-layout">
  <div class="form-intro"><p class="eyebrow">YOUR NEXT CHAPTER</p><h1>Good to have you back.</h1><p>Pick up where you left off and keep your learning moving.</p></div>
  <form class="form-panel" method="post" aria-label="Log in">
    <h2>Log in</h2>
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <p class="form-note">New to Northstar? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
